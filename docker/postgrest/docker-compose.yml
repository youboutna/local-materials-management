# =============================================================================
# Stack OSS légère (GoTrue + PostgREST + MinIO)
# =============================================================================
# 📁 Emplacement : docker/postgrest/docker-compose.yml
# 🎯 Rôle : Scénario 3 – Alternative légère
# 
# Utilisation :
#   cd docker/postgrest
#   docker compose --env-file .env up -d
# =============================================================================

services:
  postgres:
    image: postgres:15
    container_name: hadratech-postgrest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hadratech}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,btp}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # docker/postgrest/ → ../../ = racine → supabase/migrations/
      - ../../supabase/migrations/:/docker-entrypoint-initdb.d/migrations/hadratech/:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgrest-net

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: hadratech-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hadratech}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,btp}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-please-change-me-32-chars-minimum}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${POSTGREST_PORT:-3001}:3000"
    networks:
      - postgrest-net

  gotrue:
    image: supabase/gotrue:v2.189.0
    container_name: hadratech-postgrest-gotrue
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hadratech}?sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:5173}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:9999}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GOTRUE_PORT:-9999}:9999"
    networks:
      - postgrest-net

  minio:
    image: minio/minio:latest
    container_name: hadratech-postgrest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - postgrest-net

volumes:
  postgres-data:
    name: hadratech-postgrest-postgres-data
  minio-data:
    name: hadratech-postgrest-minio-data

networks:
  postgrest-net:
    name: hadratech-postgrest-net
    driver: bridge