# Self-hosted Supabase stack (starter compose).
#
# For the full stack, clone the official repo and copy its docker folder:
#   git clone --depth 1 https://github.com/supabase/supabase
#   cp -rf supabase/docker/* supabase-project/
#   bash supabase/docker/utils/generate-keys.sh
#   docker compose --env-file supabase-project/.env -f supabase-project/docker-compose.yml up -d
#
# This file provides a minimal PostgREST + GoTrue + MinIO stack for teams that
# don't need the full Supabase toolkit and just want to point VITE_*_PROVIDER
# at self-hosted infrastructure.

version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data

  postgrest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/app
      PGRST_DB_SCHEMAS: public,btp
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-please-change-me-32-chars-minimum}
    depends_on: [db]
    ports: ["3001:3000"]

  gotrue:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/app?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:5173}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-please-change-me-32-chars-minimum}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:9999}
    depends_on: [db]
    ports: ["9999:9999"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
