# Stack entreprise — Keycloak (SSO) + PostgREST + PostgreSQL + MinIO + serveur de logs
# Déployer : docker compose -f docker-compose.keycloak.yml up -d
#
# Variables : POSTGRES_PASSWORD, POSTGRES_DB, PGRST_DB_SCHEMAS, PGRST_DB_EXTRA_SEARCH_PATH,
#             JWT_SECRET, KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD,
#             MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, LOG_DIR, LOG_RETENTION_DAYS

version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,btp}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-please-change-me-32-chars-minimum}
      PGRST_JWT_AUD: account
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-app}
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  log-server:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: node server/log-server.mjs
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_DIR: ${LOG_DIR:-/var/logs/app}
      LOG_PORT: 3002
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./server:/app/server:ro
      - app-logs:${LOG_DIR:-/var/logs/app}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  minio-data:
  app-logs:
