# Stack complète avec Keycloak pour SSO Entreprise
# Utilisée avec VITE_AUTH_PROVIDER=keycloak, VITE_DATA_PROVIDER=postgrest
# Déployer : docker compose up -d
# 
# Variables utilisées :
#   POSTGRES_PASSWORD, POSTGRES_DB, PGRST_DB_SCHEMAS, PGRST_DB_EXTRA_SEARCH_PATH
#   JWT_SECRET, API_EXTERNAL_URL
#   KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD, KEYCLOAK_HOSTNAME
#   MINIO_ROOT_USER, MINIO_ROOT_PASSWORD

version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # Ces variables sont utilisées par PostgREST et le Studio
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,btp}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/keycloak/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      # Schémas exposés par l'API PostgREST
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,btp}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-please-change-me-32-chars-minimum}
      PGRST_SERVER_PROXY_URI: ${API_EXTERNAL_URL:-http://localhost:3001}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${API_EXTERNAL_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-app}
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
    volumes:
      - ./docker/keycloak/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
      - "8443:8443"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data: