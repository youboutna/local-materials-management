# =============================================================================
# Supabase Project Configuration – HadraTech-GPI
# =============================================================================
# Version compatible avec la CLI Supabase v2
# =============================================================================

# ---- Projet ----
project_id = "ttrfbzonzcyimfmezuqv"

# ---- API ----
[api]
port = 54321
schemas = ["public", "btp", "auth", "storage", "graphql_public"]
extra_search_path = ["public", "extensions", "btp"]
max_rows = 1000

# ---- Auth ----
[auth]
enable_signup = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth",
  "http://localhost:5173/",
  "https://ttrfbzonzcyimfmezuqv.supabase.co/auth/v1/callback",
  "https://*.lovableproject.com/auth/callback",
  "https://*.lovableproject.com/auth",
  "https://*.lovableproject.com/"
]

# ---- Google OAuth ----
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "https://ttrfbzonzcyimfmezuqv.supabase.co/auth/v1/callback"

# ---- GitHub OAuth (optionnel) ----
# [auth.external.github]
# enabled = false
# client_id = "env(GITHUB_CLIENT_ID)"
# secret = "env(GITHUB_CLIENT_SECRET)"
# redirect_uri = "https://ttrfbzonzcyimfmezuqv.supabase.co/auth/v1/callback"

# ---- Edge Functions ----
[functions.send-email-notification]
verify_jwt = false

[functions.send-sms-notification]
verify_jwt = false

[functions.schedule-call]
verify_jwt = false

[functions.assign-task-to-employee]
verify_jwt = false

[functions.send-tender-submission-notification]
verify_jwt = false

# ---- Database Migrations ----
[db]
# Le format des migrations est imposé par la CLI:
# <timestamp>_<name>.sql
# Exemple: 20250726000000_init.sql
# Ne pas utiliser de tirets (-) après le timestamp
# Utiliser des tirets bas (_)