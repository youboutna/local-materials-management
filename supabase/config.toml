
# This is the Supabase project configuration file
project_id = "env(VITE_SUPABASE_PROJECT_ID)"

# CORS settings to allow requests from all origins in development
[api]
port = 54321
schemas = ["public", "storage", "graphql_public", "btp"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.cors]
enabled = true
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allowed_headers = ["Authorization", "Content-Type"]
exposed_headers = ["Content-Range", "X-Total-Count"]

# Update environment to use correct Lovable project domain with Google OAuth support
[auth]
enable_signup = true
site_url = "https://539e8f41-564f-4a0a-bf12-5745f07e400b.lovableproject.com"
additional_redirect_urls = [
  "https://539e8f41-564f-4a0a-bf12-5745f07e400b.lovableproject.com/auth/callback", 
  "https://539e8f41-564f-4a0a-bf12-5745f07e400b.lovableproject.com/auth",
  "https://539e8f41-564f-4a0a-bf12-5745f07e400b.lovableproject.com/"
]

# Google OAuth configuration
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "https://huttgbybeuzeikaqfvam.supabase.co/auth/v1/callback"

# Function configurations for better performance
[functions.send-email-notification]
verify_jwt = false

[functions.send-sms-notification]
verify_jwt = false

[functions.schedule-call]
verify_jwt = false

[functions.assign-task-to-employee]
verify_jwt = false

[functions.send-tender-submission-notification]
verify_jwt = false
