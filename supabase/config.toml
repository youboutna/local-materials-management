# =============================================================================
# Supabase Project Configuration – HadraTech-GPI
# =============================================================================
# 📁 Emplacement : supabase/config.toml
# 🎯 Rôle : Configuration CLI Supabase (dev uniquement)
# ⚠️ Pour la production self-hosted → supabase/docker/.env.hadratech
# =============================================================================

# ---- Projet ----
project_id = "hadratech-gpi-local"

# =============================================================================
# API
# =============================================================================
[api]
# ⚠️ Port CLI (dev). En self-hosted Docker, Kong expose le 8000.
port = 8000
schemas = ["public", "btp"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# =============================================================================
# Base de données
# =============================================================================
[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# =============================================================================
# Studio
# =============================================================================
[studio]
enabled = true
port = 54323
api_url = "http://localhost"

# =============================================================================
# Auth (GoTrue)
# =============================================================================
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  # --- Dev local ---
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth",
  "http://localhost:5173/",
  "http://localhost:8000/auth/v1/callback",
  # --- Production (self-hosted) ---
  "https://app.hadratech.com/auth/callback",
  "https://app.hadratech.com/auth",
  "https://app.hadratech.com/",
  "https://gpi.hadratech.com/auth/callback",
  "https://gpi.hadratech.com/",
  "https://supabase.hadratech.com/auth/v1/callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

# =============================================================================
# OAuth Providers
# =============================================================================
# ⚠️ Les vraies valeurs → .env (non versionné)
# ⚠️ Les secrets → Dashboard Supabase (Authentication → Providers)

# ---- Google OAuth ----
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# ⚠️ Dev local :
redirect_uri = "http://localhost:8000/auth/v1/callback"
# ⚠️ Prod self-hosted :
# redirect_uri = "https://app.hadratech.com/auth/v1/callback"

# ---- GitHub OAuth ----
[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_SECRET)"
redirect_uri = "http://localhost:8000/auth/v1/callback"

# ---- Microsoft OAuth (optionnel) ----
[auth.external.microsoft]
enabled = false
client_id = "env(MICROSOFT_CLIENT_ID)"
secret = "env(MICROSOFT_SECRET)"
redirect_uri = "http://localhost:8000/auth/v1/callback"

# =============================================================================
# Storage
# =============================================================================
[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.documents]
public = false
file_size_limit = "50MiB"
allowed_mime_types = [
  "application/pdf",
  "image/png",
  "image/jpeg",
  "image/webp",
  "application/msword",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "application/vnd.ms-excel",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
]

# =============================================================================
# Realtime
# =============================================================================
[realtime]
enabled = true

# =============================================================================
# Analytics
# =============================================================================
[analytics]
enabled = false

# =============================================================================
# Edge Functions
# =============================================================================
[functions.send-email-notification]
verify_jwt = false

[functions.send-sms-notification]
verify_jwt = false

[functions.schedule-call]
verify_jwt = false

[functions.assign-task-to-employee]
verify_jwt = false

[functions.send-tender-submission-notification]
verify_jwt = false

[functions.update-email]
verify_jwt = false

[functions.cleanup-expired-user-roles]
verify_jwt = true

# =============================================================================
# Logs
# =============================================================================
[logflare]
enabled = false

# =============================================================================
# Migrations
# =============================================================================
# Format : <timestamp>_<name>.sql
# ⚠️ Ne pas utiliser de tirets (-) après le timestamp
# ⚠️ Utiliser des tirets bas (_)
#
# Migrations actuelles :
#   - 20250719000001_create_suppliers_table.sql
#   - 20250726000000_init.sql
#   - 20260824120000_create_profit_distributions.sql
#   - 20260909120000_create_profit_distributions.sql
#   - 20260910120000_user_roles_status_alignment.sql