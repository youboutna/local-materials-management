# Stack open-source légère — totalement indépendante de Supabase
# PostgREST + GoTrue + MinIO + PostgreSQL
# Utilisée avec VITE_AUTH_PROVIDER=gotrue, VITE_DATA_PROVIDER=postgrest
# Déployer : docker compose -f docker-compose.postgrest.yml up -d
#
# Variables utilisées :
#   POSTGRES_PASSWORD, POSTGRES_DB, PGRST_DB_SCHEMAS, PGRST_DB_EXTRA_SEARCH_PATH
#   JWT_SECRET, API_EXTERNAL_URL, SITE_URL, MAILER_AUTOCONFIRM
#   MINIO_ROOT_USER, MINIO_ROOT_PASSWORD

version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      PGDATA: /var/lib/postgresql/data/pgdata
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,btp}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,btp}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-please-change-me-32-chars-minimum}
      PGRST_SERVER_PROXY_URI: ${API_EXTERNAL_URL:-http://localhost:3001}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${API_EXTERNAL_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

  gotrue:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:5173}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-please-change-me-32-chars-minimum}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:9999}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9999:9999"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data: